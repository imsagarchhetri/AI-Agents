version: '3.8'

services:
  backend:
    build: .
    container_name: hr-backend
    ports:
      - "8001:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  frontend:
    build: .
    container_name: hr-frontend
    ports:
      - "8502:8501"
    env_file:
      - .env
    environment:
      - API_URL=http://backend:8000
    volumes:
      - .:/app
    command: streamlit run ui.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - backend
